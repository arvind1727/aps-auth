<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APS File Manager</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0A1630,#14305F);color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif;text-align:center}
 div{max-width:420px;padding:24px} h1{font-size:24px;margin:0 0 10px} p{opacity:.8;line-height:1.5;margin:0}
 .spin{width:36px;height:36px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.25);border-top-color:#4C9AFF;border-radius:50%;animation:s 1s linear infinite}
 @keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div>
<div class="spin" id="sp"></div>
<h1 id="t">Sending to your TV...</h1>
<p id="m">Keep this page open for a moment.</p>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var state = q.get('state') || '';
  var target = state.split('|')[0];
  var ok = /^(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|localhost|127\.0\.0\.1):\d{2,5}$/.test(target);
  function fail(t, m){ document.getElementById('sp').style.display='none'; document.getElementById('t').textContent=t; document.getElementById('m').textContent=m; }
  if (!ok) { fail('This link is not valid', 'Please start again from the sign-in screen on your TV.'); return; }
  location.replace('http://' + target + '/cb' + location.search);
  setTimeout(function(){
    fail("Couldn't reach your TV", 'Make sure this phone is on the same Wi-Fi as the TV, then start again from the TV.');
  }, 8000);
})();
</script></body></html>
